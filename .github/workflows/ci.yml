name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-check of main against opencode-ai@latest. NOTE: this is no
    # longer the primary guard -- the required per-PR `latest` legs of the
    # test job below catch a load-bearing-fact break (F1-F9, plan risk G6)
    # first, and block the merge. This scheduled job only covers drift that
    # lands on main between PRs, when no PR run would notice.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    name: test (opencode ${{ matrix.opencode }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # REQUIRED e2e against both the pinned floor and current opencode.
        # 1.18.21 is the version package.json pins @opencode-ai/plugin to;
        # latest catches a plugin-loading contract break in a required job
        # (issue #12) instead of only in the weekly continue-on-error drift
        # job. If latest goes red, bump the pin / fix forward promptly --
        # this leg deliberately blocks merge while opencode-current is broken.
        opencode: ["1.18.21", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Install opencode ${{ matrix.opencode }}
        run: npm install -g opencode-ai@${{ matrix.opencode }}

      - name: opencode --version
        run: opencode --version

      - name: e2e
        run: bun run e2e

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.opencode }}-${{ matrix.os }}
          path: test/e2e/out
          if-no-files-found: warn

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: drift (opencode-ai@latest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Install opencode-ai@latest
        run: npm install -g opencode-ai@latest

      - name: opencode --version
        run: opencode --version

      - name: e2e
        run: bun run e2e

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-drift-${{ matrix.os }}
          path: test/e2e/out
          if-no-files-found: warn
