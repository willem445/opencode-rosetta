name: Release

# Publishes opencode-rosetta to npm and cuts the matching GitHub release.
#
# Two ways in, with deliberately different powers:
# - `workflow_dispatch` -> DRY-RUN ONLY. Runs the full pipeline up to
#   `npm publish --dry-run` and publishes nothing. There is no input (and no
#   other route) that turns a dispatch into a real publish.
# - push a `v*` tag -> full release (npm publish + GitHub release). This is
#   the ONLY path to `npm publish`, and it traverses the human gate twice:
#   the job runs in the protected `npm` environment (required reviewer,
#   self-review prevented), and the tag itself must be pushed by hand.
#
# The publish steps are guarded on TAG context (`refs/tags/v*`), never on an
# input or a branch name, so a dispatch cannot reach them by any parameter
# choice. Provenance needs `id-token: write` (npm trusted publishing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: release (${{ startsWith(github.ref, 'refs/tags/v') && 'publish' || 'dry-run' }})
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json version"

      # Fail-safe check for the only path that publishes: refuse loudly and
      # early (before approval is spent on a doomed run) if the token secret
      # has not been configured yet.
      - name: Preflight - require NPM_TOKEN before any publish step
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::secrets.NPM_TOKEN is NOT configured -- refusing to attempt a real publish. Add it under Settings > Environments > npm (or repo secrets) first."
            exit 1
          fi
          echo "NPM_TOKEN present"

      # Always runs, including dispatch dry-runs: this is the packaging proof.
      # It packs the tarball and lists its contents without contacting the registry.
      - name: npm publish --dry-run
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog section for this version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v pat="^## \\[v${version}\\]" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for v${version}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "opencode-rosetta ${GITHUB_REF_NAME}" --notes-file release-notes.md
