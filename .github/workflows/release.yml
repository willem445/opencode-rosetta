name: Release

# Publishes opencode-rosetta to npm and cuts the matching GitHub release.
#
# Two ways in, with deliberately different powers:
# - `workflow_dispatch` -> DRY-RUN ONLY. Runs the full pipeline up to
#   `npm publish --dry-run` and publishes nothing (if package.json's version
#   is already on the registry, the dry-run is skipped with a warning -- npm
#   >= 11 refuses to dry-run over an existing version). There is no input
#   (and no other route) that turns a dispatch into a real publish.
# - push a `v*` tag -> full release (npm publish + GitHub release). This is
#   the ONLY path to `npm publish`, and it traverses the human gate twice:
#   the job runs in the protected `npm` environment (required reviewer,
#   self-review prevented), and the tag itself must be pushed by hand.
#
# Authentication is npm TRUSTED PUBLISHING (OIDC), not a token: the npm CLI
# exchanges the job's GitHub OIDC identity for a short-lived publish
# credential. There is deliberately NO NPM_TOKEN secret and NO NODE_AUTH_TOKEN
# anywhere in this file. Requirements per https://docs.npmjs.com/trusted-publishers:
# - `id-token: write` on this job (below).
# - npm CLI >= 11.5.1 (Node >= 22.14.0). The pinned Node 22 ships npm 10.x,
#   so the job upgrades npm explicitly (pinned to the v12 major) before any
#   publish command.
# - Provenance is generated automatically by trusted publishing from GitHub
#   Actions; `--provenance` is intentionally NOT passed.
#
# The publish is IDEMPOTENT: if the version in package.json already exists on
# the registry, the publish step skips loudly (warning annotation + job
# summary) and the run continues to create the GitHub release. A re-run or a
# retroactive tag therefore cannot produce a red run or double-publish --
# but it also can never be mistaken for a silent success.
#
# The publish steps are guarded on TAG context (`refs/tags/v*`), never on an
# input or a branch name, so a dispatch cannot reach them by any parameter
# choice.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: release (${{ startsWith(github.ref, 'refs/tags/v') && 'publish' || 'dry-run' }})
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 (docs.npmjs.com/trusted-publishers),
      # but the newest Node 22 LTS still bundles npm 10.9.x. Upgrade explicitly
      # so every publish command below runs on a compliant CLI.
      - name: Upgrade npm for trusted publishing
        # Pinned to the v12 major rather than @latest: npm is the tool performing
        # the publish, so an unpinned upgrade lets a future npm release change
        # publish behaviour on a workflow that only ever runs at release time --
        # i.e. it would break exactly when it is least convenient to debug. v12
        # satisfies the >= 11.5.1 trusted-publishing floor and still receives
        # fixes within the major. Bump deliberately when a new major is needed.
        run: |
          echo "bundled npm: $(npm --version)"
          npm install -g npm@12
          echo "using npm: $(npm --version)"

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json version"

      # Runs on BOTH paths (dispatch dry-run included): npm >= 11 refuses even
      # `--dry-run` with "cannot publish over previously published versions"
      # when the version already exists, so this check must precede the
      # dry-run step or a retroactive tag could never stay green.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
            echo "::warning::${pkg}@${version} ALREADY EXISTS on the npm registry -- the publish step below will SKIP and only the GitHub release will be created."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${pkg}@${version} is not yet on the npm registry."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The packaging proof. Runs whenever the version is NOT already on the
      # registry (fresh versions, and dispatch dry-runs of them). It packs the
      # tarball and lists its contents.
      - name: npm publish --dry-run
        if: ${{ steps.registry.outputs.exists != 'true' }}
        run: npm publish --dry-run --access public

      # The only real-publish step. Authenticated via OIDC (trusted publishing):
      # no NODE_AUTH_TOKEN, no NPM_TOKEN. Skips LOUDLY if the version is
      # already on the registry (idempotent re-run / retroactive tag) --
      # never silently: banner + warning annotation + job summary.
      - name: Publish to npm
        id: publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          ALREADY_ON_NPM: ${{ steps.registry.outputs.exists }}
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$ALREADY_ON_NPM" = "true" ]; then
            echo "======================================================================"
            echo "PUBLISH SKIPPED: ${pkg}@${version} already exists on the npm registry."
            echo "This is an idempotent re-run (or a retroactive tag). Nothing was"
            echo "re-published. If you expected a NEW version here, STOP and check"
            echo "whether package.json was bumped and the tag rebuilt."
            echo "======================================================================"
            echo "::warning::PUBLISH SKIPPED: ${pkg}@${version} already exists on npm -- publish skipped (idempotent re-run); the GitHub release will still be created."
            {
              echo "### :warning: npm publish SKIPPED"
              echo ""
              echo "\`${pkg}@${version}\` already exists on the npm registry, so the publish step did NOT run."
              echo "The GitHub release is still created below. If a new publish was intended, bump \`package.json\` and re-tag."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public
          fi

      - name: Extract changelog section for this version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v pat="^## \\[v${version}\\]" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for v${version}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "opencode-rosetta ${GITHUB_REF_NAME}" --notes-file release-notes.md
