name: Release

# Publishes opencode-rosetta to npm and cuts the matching GitHub release.
#
# Two ways in:
# - push a `v*` tag -> full release (npm publish + GitHub release).
# - workflow_dispatch -> dry-run by default: runs the whole pipeline up to
#   `npm publish --dry-run` and publishes nothing. Uncheck `dry_run` only if
#   you really mean it.
#
# The `npm` environment is the human gate: it is configured with required
# reviewers, so even a tag push waits for a human approval before any publish
# step runs. Provenance needs `id-token: write` (npm trusted publishing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run; no npm publish, no GitHub release)"
        type: boolean
        default: true

jobs:
  release:
    name: release (${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'publish' }})
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json version"

      # Always runs, including dry-runs: this is the packaging proof. It packs
      # the tarball and lists its contents without contacting the registry.
      - name: npm publish --dry-run
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog section for this version
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v pat="^## \\[v${version}\\]" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for v${version}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "opencode-rosetta ${GITHUB_REF_NAME}" --notes-file release-notes.md
